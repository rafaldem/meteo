# .github/workflows/ci-cd.yml
name: CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
      frontend_changed: ${{ steps.filter.outputs.frontend }}
      other_changed: ${{ steps.filter.outputs.other }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            other:
              - '**'
              - 'scripts/**'
              - '!backend/**'
              - '!frontend/**'
              - '!README.md'
              - '!.github/**'
              - '!.gitignore'

  version-management-backend:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend_changed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exit_code: ${{ steps.set-version.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt', 'backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Determine version bump level
        id: determine-level
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "bump_level=patch" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "bump_level=minor" >> $GITHUB_OUTPUT
          else
            echo "bump_level=patch" >> $GITHUB_OUTPUT
          fi

      - name: Update backend version
        id: set-version
        run: |
          EXIT_CODE=$(python scripts/update_version.py --component backend --bump-type ${{ steps.determine-level.outputs.bump_level }})
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

      - name: Commit backend version changes
        if: github.event_name == 'push'
        run: |
          git config --global user.email "${{ github.event.head_commit.author.email }}"
          git config --global user.name "${{ github.event.head_commit.author.name }}"
          git add backend/version.py backend/pyproject.toml
          git commit -m "Bump backend version to ${{ steps.set-version.outputs.exit_code }}"
          git push

  version-management-frontend:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend_changed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exit_code: ${{ steps.set-version.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Determine version bump level
        id: determine-level
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "bump_level=patch" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "bump_level=minor" >> $GITHUB_OUTPUT
          else
            echo "bump_level=patch" >> $GITHUB_OUTPUT
          fi

      - name: Update frontend version
        id: set-version
        run: |
          EXIT_CODE=$(python scripts/update_version.py --component frontend --bump-type ${{ steps.determine-level.outputs.bump_level }})
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

      - name: Commit frontend version changes
        if: github.event_name == 'push'
        run: |
          git config --global user.email "${{ github.event.head_commit.author.email }}"
          git config --global user.name "${{ github.event.head_commit.author.name }}"
          git add frontend/package.json
          git commit -m "Bump frontend version to ${{ steps.set-version.outputs.exit_code }}"
          git push

  version-management-other:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.other_changed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exit_code: ${{ steps.set-version.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Determine version bump level
        id: determine-level
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "bump_level=patch" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "bump_level=minor" >> $GITHUB_OUTPUT
          else
            echo "bump_level=patch" >> $GITHUB_OUTPUT
          fi

      - name: Update other components version
        id: set-version
        run: |
          EXIT_CODE=$(python scripts/update_version.py --component other --bump-type ${{ steps.determine-level.outputs.bump_level }})
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

      - name: Commit other version changes
        if: github.event_name == 'push'
        run: |
          git config --global user.email "${{ github.event.head_commit.author.email }}"
          git config --global user.name "${{ github.event.head_commit.author.name }}"
          git add */version.* */pyproject.toml
          git commit -m "Bump other components version to ${{ steps.set-version.outputs.exit_code }}"
          git push